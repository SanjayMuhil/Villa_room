<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 90" width="100%" height="100%">
  <defs>
    <style>
      .logo-sun {
        transform-origin: 64px 26px;
        animation: sunRise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      .logo-wave {
        stroke-dasharray: 100;
        stroke-dashoffset: 100;
        animation: waveDraw 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.15s forwards;
      }
      .logo-roof {
        opacity: 0;
        animation: roofFade 0.6s ease-out 0.1s forwards;
      }
      @keyframes sunRise {
        0% { transform: translateY(12px) scale(0.6); opacity: 0; }
        100% { transform: translateY(0) scale(1); opacity: 1; }
      }
      @keyframes waveDraw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes roofFade {
        to { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .logo-sun, .logo-wave, .logo-roof {
          animation: none !important;
          stroke-dashoffset: 0 !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
      .brand-title {
        font-family: 'Bricolage Grotesque', system-ui, -apple-system, sans-serif;
        font-weight: 800;
        font-size: 26px;
        fill: #0b4a57;
      }
      .brand-highlight {
        fill: #f0a21f;
      }
      .brand-sub {
        font-family: 'DM Sans', system-ui, -apple-system, sans-serif;
        font-weight: 600;
        font-size: 11px;
        letter-spacing: 0.18em;
        fill: #127a86;
      }
    </style>
  </defs>

  <!-- Icon Container (80x80) -->
  <g transform="translate(6, 5)">
    <rect width="80" height="80" rx="20" fill="#0b4a57" />
    <!-- Rising Sun -->
    <circle class="logo-sun" cx="56" cy="24" r="12" fill="#f0a21f" />
    <!-- Villa Roof -->
    <g class="logo-roof">
      <path d="M 18 44 L 40 22 L 62 44" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
      <circle cx="40" cy="35" r="3.5" fill="#f0a21f" />
      <path d="M 24 44 L 24 62 L 56 62 L 56 44" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
      <path d="M 35 62 L 35 50 C 35 48 45 48 45 50 L 45 62 Z" fill="#127a86" />
    </g>
    <!-- Wave -->
    <path class="logo-wave" d="M 10 70 C 20 63, 30 75, 42 68 C 54 61, 64 73, 72 66" fill="none" stroke="#127a86" stroke-width="4" stroke-linecap="round" />
    <path class="logo-wave" d="M 16 74 C 26 69, 36 78, 48 73 C 58 68, 66 76, 74 71" fill="none" stroke="#f0a21f" stroke-width="2.5" stroke-linecap="round" opacity="0.85" />
  </g>

  <!-- Brand Typography -->
  <text x="102" y="47" class="brand-title">
    Dinesh Boy <tspan class="brand-highlight">Villas</tspan>
  </text>
  <text x="103" y="68" class="brand-sub">
    ECR, CHENNAI • PRIVATE RETREATS
  </text>
</svg>
