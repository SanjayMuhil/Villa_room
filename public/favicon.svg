<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <style>
      .logo-sun {
        transform-origin: 70px 30px;
        animation: sunRise 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) forwards;
      }
      .logo-wave {
        stroke-dasharray: 120;
        stroke-dashoffset: 120;
        animation: waveDraw 0.9s cubic-bezier(0.2, 0.8, 0.2, 1) 0.15s forwards;
      }
      .logo-roof {
        opacity: 0;
        animation: roofFade 0.6s ease-out 0.1s forwards;
      }
      @keyframes sunRise {
        0% { transform: translateY(14px) scale(0.6); opacity: 0; }
        100% { transform: translateY(0) scale(1); opacity: 1; }
      }
      @keyframes waveDraw {
        to { stroke-dashoffset: 0; }
      }
      @keyframes roofFade {
        to { opacity: 1; }
      }
      @media (prefers-reduced-motion: reduce) {
        .logo-sun, .logo-wave, .logo-roof {
          animation: none !important;
          stroke-dashoffset: 0 !important;
          opacity: 1 !important;
          transform: none !important;
        }
      }
    </style>
  </defs>

  <!-- Background pill/badge -->
  <rect width="100" height="100" rx="24" fill="#0b4a57" />

  <!-- Rising Sun -->
  <circle class="logo-sun" cx="68" cy="28" r="14" fill="#f0a21f" />

  <!-- Villa Roof & Structure -->
  <g class="logo-roof">
    <!-- Main Roof Gable -->
    <path d="M 22 54 L 50 28 L 78 54" fill="none" stroke="#ffffff" stroke-width="5" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Overhang detail / attic window -->
    <circle cx="50" cy="44" r="4" fill="#f0a21f" />
    <!-- Villa Body walls -->
    <path d="M 30 54 L 30 74 L 70 74 L 70 54" fill="none" stroke="#ffffff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" opacity="0.9" />
    <!-- Door -->
    <path d="M 44 74 L 44 60 C 44 57 56 57 56 60 L 56 74 Z" fill="#127a86" />
  </g>

  <!-- Flowing Sea Wave in Sea Blue (#127a86) and Marigold accent -->
  <path class="logo-wave" d="M 12 84 C 24 76, 36 90, 50 82 C 64 74, 76 88, 88 80" fill="none" stroke="#127a86" stroke-width="5" stroke-linecap="round" />
  <path class="logo-wave" d="M 20 89 C 32 83, 44 94, 58 88 C 70 82, 80 92, 90 86" fill="none" stroke="#f0a21f" stroke-width="3" stroke-linecap="round" opacity="0.85" />
</svg>
